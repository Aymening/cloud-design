openapi: 3.0.3

info:
  title: CRUD Microservices API Gateway
  version: 1.0.0
  description: |
    Public HTTP interface for movie inventory operations and asynchronous
    billing message submission. Movie requests are forwarded to the Inventory
    API, while billing requests are published to RabbitMQ.

servers:
  - url: https://{host}
    description: >-
      API Gateway behind the AWS load balancer. Get the address with
      `terraform -chdir=terraform/houda/platform output -raw app_url`.
    variables:
      host:
        default: cloud-design-alb.eu-west-3.elb.amazonaws.com

# Every /api/* route needs a Cognito access token (scripts/get-token.sh).
security:
  - cognitoAccessToken: []

tags:
  - name: Health
    description: Gateway status, no token needed
  - name: Movies
    description: Movie inventory operations forwarded to the Inventory API
  - name: Billing
    description: Asynchronous billing message submission

paths:
  /health:
    get:
      tags:
        - Health
      summary: Gateway health check
      description: |
        Used by the load balancer and the ECS health check. It is the only
        endpoint that doesn't need a token.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The gateway is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
              example:
                status: ok
                service: api-gateway-app

  /api/movies:
    get:
      tags:
        - Movies
      summary: List movies
      description: |
        Returns every movie. When `title` is provided, only movies whose title
        contains the supplied value are returned. Matching is case-insensitive.
        The endpoint also accepts a trailing slash.
      operationId: listMovies
      parameters:
        - name: title
          in: query
          required: false
          description: Case-insensitive text to search for within movie titles.
          schema:
            type: string
          example: matrix
      responses:
        "200":
          description: Movies returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
              example:
                - id: 1
                  title: The Matrix
                  description: A science-fiction movie.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

    post:
      tags:
        - Movies
      summary: Create a movie
      description: Creates and persists a new movie. The endpoint also accepts a trailing slash.
      operationId: createMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieCreate"
            example:
              title: A new movie
              description: Very short description
      responses:
        "201":
          description: Movie created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
              example:
                id: 1
                title: A new movie
                description: Very short description
        "400":
          description: The request body is missing or does not contain a title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Movie title is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

    delete:
      tags:
        - Movies
      summary: Delete all movies
      description: Deletes every movie stored by the Inventory API. The endpoint also accepts a trailing slash.
      operationId: deleteAllMovies
      responses:
        "200":
          description: All movies deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Successfully deleted all 2 movies.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/movies/{id}:
    parameters:
      - $ref: "#/components/parameters/MovieId"

    get:
      tags:
        - Movies
      summary: Retrieve a movie
      description: Returns one movie by ID. The endpoint also accepts a trailing slash.
      operationId: getMovieById
      responses:
        "200":
          description: Movie returned successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

    put:
      tags:
        - Movies
      summary: Update a movie
      description: |
        Updates the supplied fields of an existing movie. At least one JSON
        property must be supplied. The endpoint also accepts a trailing slash.
      operationId: updateMovie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieUpdate"
            example:
              title: Updated movie title
              description: Updated description
      responses:
        "200":
          description: Movie updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: The request body is empty or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid payload
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

    delete:
      tags:
        - Movies
      summary: Delete a movie
      description: Deletes one movie by ID. The endpoint also accepts a trailing slash.
      operationId: deleteMovieById
      responses:
        "200":
          description: Movie deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Movie with ID 1 deleted successfully.
        "404":
          $ref: "#/components/responses/MovieNotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/InventoryUnavailable"

  /api/billing:
    post:
      tags:
        - Billing
      summary: Queue a billing order
      description: |
        Validates the order and publishes it to the durable RabbitMQ billing
        queue. It answers 200 once RabbitMQ has confirmed that the message is
        stored. Processing is asynchronous, so this operation does not return
        a stored order. The endpoint also
        accepts a trailing slash.
      operationId: queueBillingOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingOrder"
            example:
              user_id: 20
              number_of_items: 99
              total_amount: 250
      responses:
        "200":
          description: Billing message published successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                message: Message posted
        "400":
          description: >-
            The body is not JSON, a required field is missing, or
            number_of_items / total_amount are not valid numbers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                wrongContentType:
                  value:
                    error: Content-Type must be application/json
                missingFields:
                  value:
                    error: "Missing required fields: total_amount"
                invalidValues:
                  value:
                    error: number_of_items must be positive and total_amount must be non-negative
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: >-
            RabbitMQ could not be reached or did not confirm that it stored
            the message. The order was not queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Billing queue unavailable

components:
  securitySchemes:
    cognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access token of a user of the Cognito user pool. Requests without a
        valid token get 401.

  parameters:
    MovieId:
      name: id
      in: path
      required: true
      description: Numeric identifier of the movie.
      schema:
        type: integer
        minimum: 1
      example: 1

  schemas:
    Movie:
      type: object
      required:
        - id
        - title
        - description
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        title:
          type: string
          maxLength: 255
          example: A new movie
        description:
          type: string
          nullable: true
          example: Very short description

    MovieCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 255
          example: A new movie
        description:
          type: string
          nullable: true
          default: ""
          example: Very short description

    MovieUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          maxLength: 255
          example: Updated movie title
        description:
          type: string
          nullable: true
          example: Updated description

    BillingOrder:
      type: object
      required:
        - user_id
        - number_of_items
        - total_amount
      properties:
        user_id:
          oneOf:
            - type: integer
            - type: string
          example: 20
        number_of_items:
          oneOf:
            - type: integer
            - type: string
          example: 99
        total_amount:
          oneOf:
            - type: number
              format: double
            - type: string
          example: 250

    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

  responses:
    Unauthorized:
      description: The Authorization header is missing, or the token is invalid or expired.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingToken:
              value:
                error: Missing bearer token
            invalidToken:
              value:
                error: Invalid or expired token

    MovieNotFound:
      description: No movie exists with the supplied ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Movie not found

    InternalError:
      description: The Inventory API encountered an internal error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InventoryUnavailable:
      description: The Gateway could not contact the Inventory API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Inventory service unavailable
